[package]
name = "sipkit-wasm"
version = "0.1.0"
description = "wasm-bindgen bindings for the sipkit kernel"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sipkit = { path = "../sipkit" }
# Must equal the installed wasm-bindgen-cli version.
wasm-bindgen = "=0.2.129"
