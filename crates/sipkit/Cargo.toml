[package]
name = "sipkit"
version = "0.1.0"
description = "Compute kernel for the SIPmath 3.1 Standard: HDR 2.0 PRNG and Metalog quantile functions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dev-dependencies]
# float_roundtrip: default parsing may be off by one ulp; golden vectors need exact values.
serde_json = { version = "1", features = ["float_roundtrip"] }
