name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # rust-toolchain.toml pins the toolchain, components and wasm target;
      # rustup installs them on first cargo invocation.
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned wasm-bindgen-cli
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' crates/sipkit-wasm/Cargo.toml)
          cargo install wasm-bindgen-cli --version "$version" --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test:rust
      - run: pnpm run test:ts

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
